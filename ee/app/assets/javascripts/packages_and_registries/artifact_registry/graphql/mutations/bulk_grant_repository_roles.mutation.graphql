# @feature_category: artifact_registry

# The payload selects `errors` alone: a grant returns no assignment, and the side panel's
# connection is corrected by a refetch rather than by normalizing a payload.
mutation bulkGrantArtifactRegistryRepositoryRoles($input: ArtifactRegistryRoleBulkGrantInput!) {
  bulkGrantRoles: artifactRegistryRoleBulkGrant(input: $input) {
    errors
  }
}
