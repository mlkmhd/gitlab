# @feature_category: consumables_cost_management

query getUserSubscriptionUsage(
  $namespacePath: ID
  $username: String
  $startDate: ISO8601Date
  $endDate: ISO8601Date
) {
  subscriptionUsage(namespacePath: $namespacePath, startDate: $startDate, endDate: $endDate) {
    enabled
    startDate
    endDate

    usersUsage {
      users(username: $username) {
        nodes {
          id
          name
          username
          avatarUrl

          usage {
            totalCreditsUsed
            nonBillableCreditsUsed @gl_introduced(version: "19.6.0")
          }

          usedFlowTypes(includeNonBillable: true) @gl_introduced(version: "19.6.0") {
            id
            title
          }
        }
      }
    }
  }
}
