# @feature_category: subscription_management
query getTrialUsage($namespacePath: ID, $organizationId: OrganizationsOrganizationID) {
  trialUsage(namespacePath: $namespacePath, organizationId: $organizationId) {
    activeTrial {
      startDate
      endDate
    }

    usersUsage {
      creditsUsed
      totalUsersUsingCredits
    }
  }
}
