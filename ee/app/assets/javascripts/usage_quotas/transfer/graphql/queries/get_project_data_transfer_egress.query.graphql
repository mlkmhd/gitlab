# @feature_category: consumables_cost_management
query getProjectDataTransferEgress($fullPath: ID!) {
  project(fullPath: $fullPath) {
    id
    dataTransfer {
      egressNodes {
        nodes {
          totalEgress
          repositoryEgress
          artifactsEgress
          packagesEgress
          registryEgress
        }
      }
    }
  }
}
