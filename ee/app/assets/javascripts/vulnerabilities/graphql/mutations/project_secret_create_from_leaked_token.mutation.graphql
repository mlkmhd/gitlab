# @feature_category: secrets_management
mutation projectSecretCreateFromLeakedToken(
  $vulnerabilityId: VulnerabilityID!
  $name: String!
  $description: String
) {
  projectSecretCreateFromLeakedToken(
    input: { vulnerabilityId: $vulnerabilityId, name: $name, description: $description }
  ) {
    errors
    projectSecret {
      name
    }
  }
}
