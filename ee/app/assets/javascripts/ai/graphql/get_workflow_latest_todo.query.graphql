# @feature_category: duo_agent_platform
query getWorkflowLatestTodo($workflowId: AiDuoWorkflowsWorkflowID!) {
  duoWorkflowWorkflows(workflowId: $workflowId) {
    nodes {
      id
      latestCheckpoint {
        latestTodoDuoMessage @gl_introduced(version: "19.6.0") {
          content
          messageType
          messageSubType
          status
          toolInfo
          messageId
        }
      }
    }
  }
}
