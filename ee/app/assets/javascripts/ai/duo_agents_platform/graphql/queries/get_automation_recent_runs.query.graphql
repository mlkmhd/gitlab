# @feature_category: dap_triggers
#import "~/graphql_shared/fragments/page_info.fragment.graphql"

query getAutomationRecentRuns(
  $projectPath: ID!
  $id: AiFlowTriggerID!
  $first: Int
  $last: Int
  $after: String
  $before: String
  $statuses: [DuoWorkflowStatus!]
  $search: String
  $createdAfter: Time
  $createdBefore: Time
  $sort: DuoWorkflowsWorkflowSort
) {
  project(fullPath: $projectPath) {
    id
    aiFlowTriggers(ids: [$id]) {
      nodes {
        id
        sessions(
          first: $first
          last: $last
          after: $after
          before: $before
          statuses: $statuses
          search: $search
          createdAfter: $createdAfter
          createdBefore: $createdBefore
          sort: $sort
        ) @gl_introduced(version: "19.6.0") {
          nodes {
            id
            status
            createdAt
            updatedAt
          }
          pageInfo {
            ...PageInfo
          }
        }
      }
    }
  }
}
