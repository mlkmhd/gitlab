# @feature_category: duo_agent_platform
#import "../fragments/duo_message.fragment.graphql"

query getAgentFlowMessages(
  $workflowId: AiDuoWorkflowsWorkflowID!
  $before: String!
  $pageSize: Int!
) {
  duoWorkflowWorkflows(workflowId: $workflowId) {
    edges {
      node {
        id
        latestCheckpoint {
          messages(last: $pageSize, before: $before) @gl_introduced(version: "19.6.0") {
            nodes {
              ...AgentFlowDuoMessage
            }
            pageInfo {
              hasPreviousPage
              startCursor
            }
          }
        }
      }
    }
  }
}
