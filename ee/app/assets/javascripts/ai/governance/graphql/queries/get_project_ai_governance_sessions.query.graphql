# @feature_category: compliance_management
query getProjectAiGovernanceSessions(
  $projectFullPath: ID!
  $first: Int
  $agentClass: AiGovernanceAgentClass
  $withDetails: Boolean = false
) {
  project(fullPath: $projectFullPath) {
    id
    aiGovernanceSessions(first: $first, agentClass: $agentClass) {
      nodes {
        id
        sessionId
        flowType
        source
        agentType
        sessionStartedAt
        auditEventsCount
        webPath @include(if: $withDetails)
        downloadPath @include(if: $withDetails)
        project @include(if: $withDetails) {
          id
          name
          webPath
          fullPath
        }
        triggeredBy @include(if: $withDetails) {
          id
          name
          username
          avatarUrl
          webPath
        }
      }
    }
  }
}
