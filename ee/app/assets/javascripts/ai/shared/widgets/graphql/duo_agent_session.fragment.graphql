# @feature_category: duo_agent_platform
#import "~/graphql_shared/fragments/user.fragment.graphql"

fragment DuoAgentSession on DuoWorkflow {
  id
  title
  status
  humanStatus
  createdAt
  updatedAt
  workflowDefinition
  webPath @gl_introduced(version: "19.6.0")
  userPermissions {
    restartDuoWorkflow
  }
  restartedAs @gl_introduced(version: "19.6.0") {
    id
    webPath
  }
  user {
    ...User
  }
  project {
    id
    name
    fullPath
  }
}
