fragment JobListItem on CiJob {
  artifacts {
    nodes {
      id
      downloadPath
      fileType
    }
  }
  browseArtifactsPath
  allowFailure
  status
  scheduledAt
  manualJob
  triggered
  createdByTag
  detailedStatus {
    id
    detailsPath
    group
    icon
    label
    text
    tooltip
    action {
      id
      buttonTitle
      icon
      method
      path
      title
      confirmationMessage
    }
  }
  id
  refName
  refPath
  tags
  shortSha
  commitPath
  pipeline {
    id
    path
    user {
      id
      name
      webPath
      avatarUrl
    }
    ... on Pipeline {
      commit {
        id
        shortId
        sha
        title
        webPath
        authoredDate
        authorName
        authorGravatar
        author {
          id
          name
          avatarUrl
        }
      }
    }
  }
  stage {
    id
    name
  }
  name
  duration
  finishedAt
  coverage
  retryable
  playable
  cancelable
  active
  stuck
  userPermissions {
    readBuild
    readJobArtifacts
    updateBuild
    cancelBuild
  }
}
