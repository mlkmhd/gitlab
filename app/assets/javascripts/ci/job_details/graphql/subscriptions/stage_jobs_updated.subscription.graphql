# @feature_category: continuous_integration
subscription jobDetailsStageJobsUpdated($stageId: CiStageID!) {
  ciStageUpdated(stageId: $stageId) {
    id
    detailedStatus {
      id
      detailsPath
      group
      icon
      label
      text
      tooltip
    }
    scheduled
    scheduledAt
  }
}
