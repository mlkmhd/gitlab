query mergeRequests(
  $fullPath: ID!
  $startDate: Time!
  $endDate: Time!
  $state: MergeRequestState!
  $labelNames: [String!]
) {
  project(fullPath: $fullPath) {
    id
    mergeRequests(
      mergedBefore: $endDate
      mergedAfter: $startDate
      state: $state
      labels: $labelNames
    ) {
      merge_request_throughput: timeLimitedCount @gl_introduced(version: "19.6.0")
    }
  }
  group(fullPath: $fullPath) {
    id
    mergeRequests(
      mergedBefore: $endDate
      mergedAfter: $startDate
      state: $state
      labels: $labelNames
      includeSubgroups: true
    ) {
      merge_request_throughput: timeLimitedCount @gl_introduced(version: "19.6.0")
    }
  }
}
