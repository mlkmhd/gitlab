# @feature_category: notifications
# The issuable alias matches issue_comment_todos.query.graphql
# so noteable_note.vue can read both responses with the same update hook.
query mergeRequestCommentTodos($id: MergeRequestID!, $noteId: NoteID!) {
  issuable: mergeRequest(id: $id) {
    id
    currentUserTodos(state: pending, noteId: $noteId) {
      nodes {
        id
      }
    }
  }
}
