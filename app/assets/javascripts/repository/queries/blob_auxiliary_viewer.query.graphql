# @feature_category: source_code_management
query getBlobAuxiliaryViewer(
  $projectPath: ID!
  $filePath: String!
  $ref: String!
  $refType: RefType
) {
  project(fullPath: $projectPath) {
    __typename
    id
    repository {
      __typename
      blobs(paths: [$filePath], ref: $ref, refType: $refType) {
        __typename
        nodes {
          __typename
          id
          webPath
          auxiliaryViewer @gl_introduced(version: "19.6.0") {
            __typename
            type
          }
        }
      }
    }
  }
}
