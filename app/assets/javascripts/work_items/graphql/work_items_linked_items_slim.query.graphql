# @feature_category: portfolio_management
query workItemLinkedItemsSlim($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id

      features {
        linkedItems {
          blockedByCount
          blockingCount
          linkedItems {
            nodes {
              linkId
              linkType
              workItemState
              workItem {
                id
                iid
                confidential
                namespace {
                  id
                  fullPath
                }
                workItemType {
                  id
                  name
                  iconName
                }
                title
                titleHtml
                state
                createdAt
                closedAt
                webUrl
                reference(full: true)
              }
            }
          }
        }
      }
    }
  }
}
