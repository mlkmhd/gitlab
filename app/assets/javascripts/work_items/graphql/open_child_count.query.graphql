# @feature_category: portfolio_management
query openChildItemCount($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id

      features {
        hierarchy {
          rolledUpCountsByType {
            countsByState {
              opened
              all
              closed
            }
            workItemType {
              id
              name
              iconName
            }
          }
        }
      }
    }
  }
}
