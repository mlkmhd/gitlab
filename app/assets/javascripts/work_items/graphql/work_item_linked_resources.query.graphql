#import "./work_item_linked_resources.fragment.graphql"

# @feature_category: team_planning
query workItemLinkedResources($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id

      features {
        linkedResources {
          ...WorkItemLinkedResources
        }
      }
    }
  }
}
