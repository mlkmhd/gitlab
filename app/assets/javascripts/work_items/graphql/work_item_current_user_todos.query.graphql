#import "./work_item_current_user_todos.fragment.graphql"

# @feature_category: team_planning
query workItemCurrentUserTodos($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id

      features {
        currentUserTodos {
          ...WorkItemCurrentUserTodos
        }
      }
    }
  }
}
