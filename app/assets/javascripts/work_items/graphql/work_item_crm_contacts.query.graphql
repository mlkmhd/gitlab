#import "./work_item_crm_contacts.fragment.graphql"

# @feature_category: team_planning
query workItemCrmContacts($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id
      userPermissions {
        setWorkItemMetadata
      }

      features {
        crmContacts {
          ...WorkItemCrmContacts
        }
      }
    }
  }
}
