#import "~/work_items/graphql/timelog.fragment.graphql"

# @feature_category: team_planning
query workItemTimeTracking($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id

      features {
        timeTracking {
          type
          timeEstimate
          humanReadableAttributes {
            timeEstimate
          }
          timelogs {
            nodes {
              ...TimelogFragment
            }
          }
          totalTimeSpent
        }
      }
    }
  }
}
