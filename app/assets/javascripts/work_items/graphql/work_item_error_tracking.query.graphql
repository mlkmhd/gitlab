# @feature_category: team_planning
query workItemErrorTracking($fullPath: ID!, $iid: String!) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id

      features {
        errorTracking {
          type
          identifier
          stackTrace {
            nodes {
              absolutePath
              columnNumber
              context {
                line
                lineNumber
              }
              filename
              function
              lineNumber
            }
          }
          status
        }
      }
    }
  }
}
