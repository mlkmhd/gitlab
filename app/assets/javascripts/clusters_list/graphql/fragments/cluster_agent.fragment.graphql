fragment ClusterAgentFragment on ClusterAgent {
  id
  name
  webPath
  createdAt
  project {
    id
    fullPath
    webPath
  }
  userAccessAuthorizations {
    config
  }
  connections {
    nodes {
      metadata {
        version
      }
      warnings {
        version {
          message
        }
      }
    }
  }
  tokens {
    nodes {
      id
      lastUsedAt
    }
  }
}
