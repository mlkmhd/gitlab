# @feature_category: code_review_workflow
query workInProgress($projectPath: ID!, $iid: String!) {
  project(fullPath: $projectPath) {
    id
    mergeRequest(iid: $iid) {
      id
      shouldBeRebased
      sourceBranchProtected
      userPermissions {
        pushToSourceBranch
      }
    }
  }
}
