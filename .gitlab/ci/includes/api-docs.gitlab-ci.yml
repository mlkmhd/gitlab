include:
  - component: $CI_SERVER_FQDN/gitlab-com/gl-infra/common-ci-tasks/api-docs-refresh@v5.48.0
    inputs:
      spec_paths:
        - doc/api/openapi/openapi_v3.yaml
      stage: notify
      # A failed refresh must not mark master as broken: the daily api-docs
      # schedule catches up, so api-docs-refresh:notify alerts the team instead.
      allow_failure: true

api-docs-refresh:
  after_script:
    - echo "API_DOCS_REFRESH_STATUS=${CI_JOB_STATUS}" >> api-docs-refresh.env
    - echo "API_DOCS_REFRESH_JOB_URL=${CI_JOB_URL}" >> api-docs-refresh.env
  artifacts:
    when: always
    expire_in: 1d
    reports:
      dotenv: api-docs-refresh.env

# `when: on_failure` would never run here: GitLab treats a failed job with
# `allow_failure: true` as successful.
api-docs-refresh:notify:
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}ruby:${RUBY_VERSION}-alpine
  stage: notify
  allow_failure: true
  needs:
    - job: api-docs-refresh
      artifacts: true
  rules: !reference [api-docs-refresh, rules]
  script:
    - |
      if [ "${API_DOCS_REFRESH_STATUS}" = "success" ]; then
        echo "api-docs refresh succeeded. No alert."
        exit 0
      fi
    - 'scripts/slack alerts-api-platform ":warning: api-docs refresh failed for ${CI_COMMIT_SHORT_SHA}, so the API reference waits for the daily schedule. See ${API_DOCS_REFRESH_JOB_URL:-${CI_PIPELINE_URL}}" warning "GitLab Bot"'
