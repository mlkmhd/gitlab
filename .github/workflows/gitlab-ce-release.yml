name: Publish GitLab CE to GHCR

on:
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: gitlab-ce-release-${{ github.ref }}

jobs:
  publish:
    if: github.repository == 'mlkmhd/gitlab'
    runs-on: ${{ vars.OMNIBUS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and publish GitLab CE
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/gitlab-ce-release/publish.sh
