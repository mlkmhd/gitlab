# valid workflow:rules:changes
rules:changes with paths and compare_to properties:
  script: exit 0
  rules:
    - changes:
        paths:
          - README.md
        compare_to: main

rules:changes as array of strings:
  script: exit 0
  rules:
    - changes:
      - README.md

# valid workflow:rules:exists
# valid rules:changes:path
# valid workflow:name
workflow:
  name: 'Pipeline name'
  rules:
    - changes:
        paths:
          - README.md
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      exists:
        - Dockerfile
      variables:
        IS_A_FEATURE: 'true'
      when: always

# valid rules:null
rules-null:
  rules: null

# valid rules:interruptible
rules:interruptible as boolean:
  script: exit 0
  rules:
    - if: $TEST
      interruptible: true

# valid rules:exists
rules:exists as an array:
  rules:
    - exists: [abc.md, def.md]

rules:exists:paths:
  rules:
    - exists:
        paths: [abc.md]

rules:exists:project:
  rules:
    - exists:
        paths: [abc.md]
        project: my-group/my-project

rules:exists:project with ref:
  rules:
    - exists:
        paths: [abc.md]
        project: my-group/my-project
        ref: main

# valid rules: nested arrays of rules, which GitLab flattens.
# A YAML anchor whose value is a list of rules creates one.
.merge-request-rules: &merge-request-rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual

rules:nested array of rules from an anchor:
  script: exit 0
  rules:
    - if: $CI_COMMIT_TITLE =~ /^Draft:/
      when: never
    - *merge-request-rules

rules:rules nested more than one level:
  script: exit 0
  rules:
    - - if: $SKIP
        when: never
      - - if: $THIS == "other"
          when: always
